name: Production CI/CD Pipeline

on: 
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and verify
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with: 
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm run test 
        continue-on-error: true

  # Build and push image to GHCR
  build-and-push:
    name: Build & Push Container Image
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Login to Github Container Registry (GHCR)
        uses: docker/login-action@v3 
        with: 
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta 
        uses: docker/metadata-action@v5 
        with:
          images: \({{ env.REGISTRY }}/\){{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix= 
            type=raw,value=latest 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6 
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 

  # Deploy to Local VPS Container
  deploy:
    name: Deploy to Local VPS Container
    needs: build-and-push
    runs-on: self-hosted

    steps: 
      - name: Login to GHCR on Target Runner
        run: |
          echo "\({{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u\){{ github.actor }} --password-stdin
      - name: Pull Fresh Image & Run Database Migrations
        run: |
          # Pull the latest image build by job 2
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

          # Run prisma migrations in a temp container 
          docker run --rm \
            --env-file /var/www/my-app/.env \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            npx prisma migrate deploy

      - name: Redeploy via production Docker compose
        run: |
          cd /var/www/my-app 
          
          # Pull latest image referenced in Prod compose file
          docker compose -f docker-compose.prod.yml pull

          # Recreate and restart container gracfully
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Remove old unused dangling images to save local disk space
          docker image prune -f 