name: Production CI/CD Pipeline

on: 
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and verify
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with: 
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm run test 
        continue-on-error: true

  # Build and push image to GHCR
  build-and-push:
    name: Build & Push Container Image
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Login to Github Container Registry (GHCR)
        uses: docker/login-action@v3 
        with: 
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta 
        uses: docker/metadata-action@v5 
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix= 
            type=raw,value=latest 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6 
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 

  # Deploy to Local VPS Container
  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}

    steps:
      - name: Login to GHCR on Target Runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image & Run Database Migrations
        shell: powershell
        run: |
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker run --rm --env-file D:\kunal-working\plane\.env --network app-network ghcr.io/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Redeploy with Docker Compose
        shell: powershell
        working-directory: D:\path\to\my-app
        run: |
          docker compose -f docker-compose.prod.yml pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker image prune -af --filter "until=168h"

          