name: Test and Deploy

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm run test
        continue-on-error: true

      - name: Deploy to Local Container via Docker Exec
        shell: powershell
        run: |
          docker exec vps-container bash -c "cd /var/www/my-app && git pull origin main && npm ci --only=production && npx prisma generate && npm run build && (pm2 reload my-backend || pm2 start dist/main.js --name 'my-backend')"