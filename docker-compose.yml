version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: planner_db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: planner_pgadmin
    restart: always
    networks:
      - app-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  app-network:
    external: true